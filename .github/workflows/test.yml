name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go: ["1.27"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Check gofmt
        run: |
          # Only check tracked Go files: local scratch workspaces (ws_*/) are
          # gitignored and must not fail the build.
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on these files:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -count=1 -v -coverprofile=coverage.txt -covermode=atomic

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt

  # The engine runs leaves concurrently and shares a task tree, a merge lock
  # and a browser across them. -race is the only thing that catches a bad
  # interaction there, and it is cheap enough to always run.
  race:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Race detector
        run: go test -race ./... -count=1

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      # Pin the major version: golangci-lint v1 is built with an older Go and
      # refuses to load a config targeting go 1.27 ("the Go language version
      # used to build golangci-lint is lower than the targeted Go version").
      # The v2 series also uses a different config schema, which is what
      # .golangci.yml is written against.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  # Headless-Chrome tests are skipped when no browser is present; run one job
  # with Chrome installed so browser code paths actually get exercised.
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Download dependencies
        run: go mod download

      - name: Test with browser available
        run: go test ./... -count=1

  # The Go sidecar must cross-compile to every desktop target we ship, and
  # compile+vet natively as a Windows package (POSIX-only paths live behind
  # build tags in pkg/tools).
  go-cross:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Cross-compile ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...

  # Desktop shell on Linux: native GTK/WebKitGTK toolchain, fmt gate and the
  # headless sidecar lifecycle tests against a real linux sidecar.
  desktop-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            file

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build the Go sidecar
        run: node desktop/scripts/build-sidecar.mjs

      - name: Rustfmt
        run: cargo fmt --check --manifest-path desktop/Cargo.toml

      - name: Sidecar lifecycle tests
        run: cargo test --manifest-path desktop/Cargo.toml

  # Desktop shell on Windows: native Go build (build-tag split), the
  # triple-suffixed sidecar via the Node hook, and cargo check with the real
  # Tauri/WinSDK toolchain (rc.exe is on the runner).
  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Go build and vet (Windows)
        run: |
          go build ./...
          go vet ./...

      - name: Build the Go sidecar
        run: node desktop\scripts\build-sidecar.mjs

      - name: Cargo check
        working-directory: desktop
        run: cargo check --locked

  # Desktop UI: the Vite output web/dist is committed and embedded into the
  # Go binary. This job rebuilds from source and fails if the committed tree
  # drifts, then proves a Go-only build embeds it.
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build (tsc strict + vite)
        run: npm run build
        working-directory: web

      - name: Verify committed web/dist matches the fresh build
        run: |
          if ! git diff --quiet -- web/dist; then
            echo "::error::web/dist is out of date. Run 'make web-build' and commit the result."
            git --no-pager diff --stat -- web/dist
            git --no-pager diff -- web/dist | head -200
            exit 1
          fi

      # No Node setup here: a stock Go toolchain must build against the
      # committed, embedded dist (TR-11.1).
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Go build embeds the committed UI
        run: go build ./...

      # These run with only Go installed, proving the committed web/dist is
      # embedded and served without Node (TestStatic_ServesEmbeddedDist).
      - name: Go tests serve the embedded UI
        run: go test ./web/ ./pkg/server/ -count=1 -v
