name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go: ["1.27"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Check gofmt
        run: |
          # Only check tracked Go files: local scratch workspaces (ws_*/) are
          # gitignored and must not fail the build.
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on these files:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -count=1 -v

  # The engine runs leaves concurrently and shares a task tree, a merge lock
  # and a browser across them. -race is the only thing that catches a bad
  # interaction there, and it is cheap enough to always run.
  race:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Race detector
        run: go test -race ./... -count=1

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      # Pin the major version: golangci-lint v1 is built with an older Go and
      # refuses to load a config targeting go 1.27 ("the Go language version
      # used to build golangci-lint is lower than the targeted Go version").
      # The v2 series also uses a different config schema, which is what
      # .golangci.yml is written against.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  # Headless-Chrome tests are skipped when no browser is present; run one job
  # with Chrome installed so browser code paths actually get exercised.
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Download dependencies
        run: go mod download

      - name: Test with browser available
        run: go test ./... -count=1

  # Desktop UI: the Vite output web/dist is committed and embedded into the
  # Go binary. This job rebuilds from source and fails if the committed tree
  # drifts, then proves a Go-only build embeds it.
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build (tsc strict + vite)
        run: npm run build
        working-directory: web

      - name: Verify committed web/dist matches the fresh build
        run: |
          if ! git diff --quiet -- web/dist; then
            echo "::error::web/dist is out of date. Run 'make web-build' and commit the result."
            git --no-pager diff --stat -- web/dist
            git --no-pager diff -- web/dist | head -200
            exit 1
          fi

      # No Node setup here: a stock Go toolchain must build against the
      # committed, embedded dist (TR-11.1).
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Go build embeds the committed UI
        run: go build ./...

      # These run with only Go installed, proving the committed web/dist is
      # embedded and served without Node (TestStatic_ServesEmbeddedDist).
      - name: Go tests serve the embedded UI
        run: go test ./web/ ./pkg/server/ -count=1 -v
